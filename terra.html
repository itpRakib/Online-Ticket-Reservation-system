<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="zQvv6qAEdvYYRS7TzMpBjC7mcFEfDAap2NvvAiBkMa0" />
  <title>TERRA — Living Goods</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Inter:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ─── Base Reset & Layout ─── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #0a0d0b;
      color: #f3f1ea;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── Background Video ─── */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Vignette Overlay ─── */
    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      background: 
        radial-gradient(120% 100% at 50% 42%, transparent 40%, rgba(6, 9, 7, 0.55) 100%),
        linear-gradient(to bottom, rgba(6, 9, 7, 0.7) 0%, transparent 22%, transparent 58%, rgba(6, 9, 7, 0.75) 100%);
    }

    /* ─── Headline Scrim ─── */
    .scrim {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(1100px, 92vw);
      height: min(560px, 72vh);
      background: radial-gradient(60% 55% at 50% 50%, rgba(6, 9, 7, 0.55) 0%, transparent 72%);
      filter: blur(8px);
      z-index: 2;
      pointer-events: none;
    }

    /* ─── Main Layout Shell ─── */
    .layout-shell {
      position: relative;
      z-index: 5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* ─── Top Navigation ─── */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px clamp(24px, 5vw, 64px);
      width: 100%;
    }

    .wordmark {
      font-family: 'Manrope', sans-serif;
      font-weight: 600;
      font-size: 24px;
      letter-spacing: 0.14em;
      color: #f3f1ea;
      text-transform: uppercase;
      user-select: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 38px;
    }

    .nav-link {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgba(243, 241, 234, 0.62);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: #f3f1ea;
    }

    .cta-shop {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #f3f1ea;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .cta-shop:hover {
      color: #57c785;
    }

    @media (max-width: 720px) {
      .nav-links {
        display: none;
      }
    }

    /* ─── Hero Section ─── */
    .hero-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transform: translateY(-2vh);
      padding: 0 20px;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #57c785;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .glow-dot {
      width: 5px;
      height: 5px;
      background-color: #57c785;
      border-radius: 50%;
      box-shadow: 0 0 12px #57c785, 0 0 4px #57c785;
      display: inline-block;
    }

    .hero-h1 {
      font-family: 'Manrope', sans-serif;
      font-weight: 500;
      font-size: clamp(72px, 15vw, 188px);
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: #f3f1ea;
      margin: 0;
    }

    .hero-h1 em.accent-word {
      font-style: normal;
      font-weight: 700;
      color: #57c785;
    }

    .hero-sub {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(15px, 1.6vw, 18px);
      color: rgba(243, 241, 234, 0.62);
      margin-top: 30px;
      margin-bottom: 0;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 15px 34px;
      border-radius: 100px;
      border: 1px solid rgba(243, 241, 234, 0.18);
      color: #f3f1ea;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 15px;
      text-decoration: none;
      margin-top: 40px;
      transition: border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease;
    }

    .hero-cta:hover {
      border-color: #57c785;
      background-color: rgba(87, 199, 133, 0.08);
      color: #ffffff;
    }

    .hero-cta .arrow {
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .hero-cta:hover .arrow {
      transform: translateX(4px);
    }

    /* ─── Bottom Caption ─── */
    .bottom-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(24px, 5vw, 64px) 30px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(243, 241, 234, 0.62);
    }

    .caption-right {
      opacity: 0.7;
    }

    @media (max-width: 720px) {
      .caption-right {
        display: none;
      }
    }

    /* ─── Entrance Motion ─── */
    @keyframes blurFadeUp {
      from {
        opacity: 0;
        filter: blur(18px);
        transform: translateY(34px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .rise {
      opacity: 0;
      animation: blurFadeUp 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .rise {
        opacity: 1 !important;
        filter: none !important;
        transform: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video class="bg-video" autoplay loop muted playsinline src="https://zxdefgavgwfxastwmmjm.supabase.co/storage/v1/object/public/assets/terra.mp4"></video>

  <!-- Vignette Overlay -->
  <div class="vignette"></div>

  <!-- Layout Shell -->
  <div class="layout-shell">
    
    <!-- Headline Scrim Pool -->
    <div class="scrim"></div>

    <!-- Top Navigation -->
    <nav class="top-nav">
      <div class="wordmark rise" style="animation-delay: 0ms;">TERRA</div>
      <div class="nav-links">
        <a href="#" class="nav-link rise" style="animation-delay: 80ms;">Science</a>
        <a href="#" class="nav-link rise" style="animation-delay: 140ms;">Products</a>
        <a href="#" class="nav-link rise" style="animation-delay: 200ms;">Journal</a>
      </div>
      <a href="#" class="cta-shop rise" style="animation-delay: 260ms;">Shop &rarr;</a>
    </nav>

    <!-- Hero Section -->
    <main class="hero-container">
      <div class="eyebrow rise" style="animation-delay: 340ms;">
        <span class="glow-dot"></span>
        <span>LIVING WELLNESS</span>
      </div>
      <h1 class="hero-h1 rise" style="animation-delay: 420ms;">
        Grow <em class="accent-word">quietly.</em>
      </h1>
      <p class="hero-sub rise" style="animation-delay: 600ms;">
        Living wellness, cultivated slowly.
      </p>
      <a href="#" class="hero-cta rise" style="animation-delay: 720ms;">
        <span>Explore Terra</span>
        <span class="arrow">&rarr;</span>
      </a>
    </main>

    <!-- Bottom Caption -->
    <footer class="bottom-caption rise" style="animation-delay: 900ms;">
      <div class="caption-left">TERRA &middot; Living Goods</div>
      <div class="caption-right">Cultivated in glass &mdash; No. 001</div>
    </footer>

  </div>

</body>
</html>
